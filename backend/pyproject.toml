[project]
name = "workflow-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bokeh>=3.1.0",
    "cellpose~=4.0.8",
    "dask[array]==2026.3.0",
    "dask-jobqueue==0.9.0",
    "distributed==2026.3.0",
    "fastapi>=0.100.0",
    "numcodecs>=0.12,<0.16",
    "numpy>=1.24.0",
    "ome-zarr>=0.9.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "scikit-image>=0.21.0",
    "scipy>=1.10.0",
    "tifffile>=2023.0.0",
    "toml>=0.10.2",
    "torch>=2.5.1",
    "torchvision>=0.26.0",
    "uvicorn[standard]>=0.20.0",
    "zarr>=2.16.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
